<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="utf-8">
<title>면접연습실</title>
<meta name="theme-color" content="#1E3A5F">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1">
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans+KR:wght@400;500;600;700&family=Noto+Serif+KR:wght@600;700&display=swap" rel="stylesheet">
<style>
:root{--ground:#F6F4EE;--card:#FFFFFF;--line:#DDD8CC;--line2:#ECE8DE;--ink:#1C2430;--muted:#5B6270;--navy:#1E3A5F;--navySoft:#E4EAF2;
--red:#B42318;--redSoft:#FBE9E7;--orange:#A15C07;--orangeDot:#D98A1C;--orangeSoft:#FDF0DC;--green:#1F7045;--greenSoft:#E3F2E8;--gold:#7A4A06;--goldSoft:#FFF8E8;--goldLine:#EAD9AC;
--dark:#141C27;--dark2:#1F2A38;--dark3:#2B4466;--darkLine:#3A4A60;--darkText:#EEF1F5;--darkMuted:#A3ADBB}
*{box-sizing:border-box}
html,body{margin:0;background:var(--ground);color:var(--ink);font-family:'IBM Plex Sans KR',system-ui,sans-serif;-webkit-text-size-adjust:100%}
body{min-height:100vh}
button,input,select,textarea{font-family:inherit;font-size:inherit;color:inherit}
button{cursor:pointer}
a{color:var(--navy)}
.app{max-width:480px;margin:0 auto;min-height:100vh;display:flex;flex-direction:column;position:relative}
.page{flex:1;padding:20px 20px 110px;display:flex;flex-direction:column;gap:16px}
.serif{font-family:'Noto Serif KR',serif}
h1{margin:0;font-family:'Noto Serif KR',serif;font-size:24px;line-height:1.4}
h2{margin:0;font-size:15px;font-weight:600}
p{margin:0}
.muted{color:var(--muted)}
.small{font-size:13px}.xs{font-size:12px}
.card{background:var(--card);border:1px solid var(--line);border-radius:16px}
.pad{padding:16px}
.row{display:flex;align-items:center;gap:12px}
.col{display:flex;flex-direction:column;gap:8px}
.grow{flex:1;min-width:0}
.btn{height:54px;border:0;border-radius:14px;background:var(--navy);color:#fff;font-size:16px;font-weight:600;width:100%}
.btn:disabled{background:#D6D1C4;color:#4A5060;cursor:default}
.btn2{height:46px;border:1px solid #C9C3B5;border-radius:12px;background:#fff;font-size:14px;font-weight:500;width:100%}
.btn-sm{height:36px;border:1px solid #C9C3B5;border-radius:10px;background:#fff;font-size:13px;padding:0 12px}
.chip{display:inline-flex;align-items:center;gap:6px;font-size:12px;border-radius:999px;padding:3px 10px;border:1px solid var(--line);background:#fff}
.tag{display:inline-block;font-size:11px;font-weight:700;border-radius:6px;padding:2px 7px}
.dot{width:10px;height:10px;border-radius:50%;flex-shrink:0;display:inline-block}
.lv-고위험{background:var(--red)}.lv-연습필요{background:var(--orangeDot)}.lv-준비완료{background:var(--green)}.lv-미연습{background:#C9C3B5}
.t-고위험{background:var(--redSoft);color:#8E1B12}.t-연습필요{background:var(--orangeSoft);color:#7A4A06}.t-준비완료{background:var(--greenSoft);color:#1F5A38}.t-미연습{background:#EEEAE0;color:var(--muted)}
.list>.li{display:flex;align-items:center;gap:14px;padding:14px 16px;border-bottom:1px solid var(--line2);background:none;border-left:0;border-right:0;border-top:0;width:100%;text-align:left}
.list>.li:last-child{border-bottom:0}
.ico{width:40px;height:40px;border-radius:10px;display:flex;align-items:center;justify-content:center;flex-shrink:0}
.ico svg{width:20px;height:20px}
.done{opacity:.55}
label.inp{font-size:14px;font-weight:600}
input.text,textarea.text,select.text{width:100%;border:1.5px solid var(--line);border-radius:12px;padding:12px 14px;background:#fff;font-size:16px}
textarea.text{min-height:150px;resize:vertical;line-height:1.6}
input.code{height:56px;font-size:20px;letter-spacing:3px;text-transform:uppercase;border-color:var(--navy)}
.nav{position:fixed;left:0;right:0;bottom:0;background:#fff;border-top:1px solid var(--line);display:grid;grid-template-columns:repeat(4,1fr);padding:6px 6px calc(10px + env(safe-area-inset-bottom));z-index:5}
.nav button{border:0;background:none;color:var(--muted);display:flex;flex-direction:column;align-items:center;gap:3px;font-size:11px;padding:6px 0}
.nav button.on{color:var(--navy);font-weight:700}
.nav svg{width:22px;height:22px}
.top{display:flex;align-items:center;justify-content:space-between}
.avatar{width:38px;height:38px;border-radius:50%;border:0;background:var(--navySoft);color:var(--navy);font-weight:700}
.hero{background:var(--navy);color:#fff;border-radius:16px;padding:18px;display:flex;align-items:center;gap:12px}
.hero select{background:transparent;border:1px solid #7F95B3;color:#DCE5F0;border-radius:999px;padding:4px 10px;font-size:12px;max-width:100%}
.hero select option{color:#000}
.dday{font-family:'Noto Serif KR',serif;font-size:34px;font-weight:700;line-height:1.1}
.comment{background:var(--goldSoft);border:1px solid var(--goldLine);border-radius:14px;padding:14px 16px}
.info{background:var(--navySoft);border-radius:14px;padding:14px 16px;color:#33415A;font-size:13px;line-height:1.6}
.warn{background:var(--orangeSoft);border-radius:14px;padding:14px 16px;color:#6B3F05;font-size:13px;line-height:1.6}
.fb{border-radius:14px;padding:14px 16px;display:flex;flex-direction:column;gap:6px;font-size:14px;line-height:1.6}
.fb b{font-size:12px}
.meter{display:grid;grid-template-columns:repeat(3,1fr);gap:3px;width:96px}
.meter i{height:8px;border-radius:2px;background:var(--line2)}
.axis{display:grid;grid-template-columns:1fr 96px 40px;align-items:center;gap:8px;height:30px;font-size:14px}
.qbig{font-family:'Noto Serif KR',serif;font-size:19px;font-weight:600;line-height:1.55}
.loading{position:fixed;inset:0;background:rgba(246,244,238,.92);display:flex;flex-direction:column;align-items:center;justify-content:center;gap:14px;z-index:20;padding:30px;text-align:center}
.spin{width:38px;height:38px;border-radius:50%;border:4px solid var(--navySoft);border-top-color:var(--navy);animation:sp 1s linear infinite}
@keyframes sp{to{transform:rotate(360deg)}}
.toast{position:fixed;left:50%;bottom:96px;transform:translateX(-50%);background:var(--ink);color:#fff;border-radius:12px;padding:12px 16px;font-size:14px;z-index:30;max-width:90%;text-align:center}
.consent-sec{display:grid;grid-template-columns:72px 1fr;gap:8px 10px;background:var(--ground);border-radius:10px;padding:12px;font-size:13px;line-height:1.55}
.consent-sec span:nth-child(odd){color:var(--muted);font-weight:600}
.check{display:flex;align-items:flex-start;gap:12px;cursor:pointer}
.check input{width:22px;height:22px;margin:0;flex-shrink:0;accent-color:var(--navy)}
.styles{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.stylebtn{border:1.5px solid var(--line);background:#fff;border-radius:12px;padding:12px;text-align:left;display:flex;flex-direction:column;gap:4px}
.stylebtn.on{border-color:var(--navy);background:var(--navySoft)}
.seg{display:flex;gap:8px}
.seg button{flex:1;height:42px;border:1.5px solid var(--line);border-radius:10px;background:#fff}
.seg button.on{border-color:var(--navy);background:var(--navySoft);color:var(--navy);font-weight:700}
/* 실전 면접 (어두운 화면) */
.darkpage{background:var(--dark);color:var(--darkText);min-height:100vh;padding:20px 18px 28px;display:flex;flex-direction:column;gap:14px}
.bubble{max-width:88%;border-radius:4px 14px 14px 14px;background:var(--dark2);padding:10px 14px;font-size:14px;line-height:1.55}
.bubble.me{align-self:flex-end;border-radius:14px 4px 14px 14px;background:var(--dark3);color:#E6EEF8}
.qcard{background:var(--dark2);border:1px solid var(--darkLine);border-radius:16px;padding:16px;display:flex;flex-direction:column;gap:10px}
.darkpage textarea{background:#0F1620;color:var(--darkText);border-color:var(--darkLine)}
.darkpage .btn2,.darkpage .btn-sm{background:transparent;color:#DCE3EC;border-color:var(--darkLine)}
.prog{display:grid;gap:4px}
.prog i{height:4px;border-radius:2px;background:#2A3646}
.prog i.on{background:#6FA8E8}
.mic{width:48px;height:48px;border-radius:50%;border:0;background:#D9573B;color:#fff;display:flex;align-items:center;justify-content:center;flex-shrink:0}
.mic.idle{background:var(--navy)}
.mic svg{width:22px;height:22px}
.hl{background:#FFE3A3;border-bottom:2px solid #B54708;padding:0 2px}
details summary{cursor:pointer;list-style:none}
details summary::-webkit-details-marker{display:none}
.hidden{display:none!important}
</style>
</head>
<body>
<div class="app" id="app"></div>
<div id="overlay"></div>

<script>
/* ▼▼ 선생님 웹 앱 주소 (…/exec 로 끝나는 주소) ▼▼ */
var APP_URL = "https://script.google.com/macros/s/AKfycbw6iqmnpnkpo7jCzkgck9JYej79r1c-I2_CDplGCSyJSz4JPjbXIEtit5JRHfK5ue4Vww/exec";
/* ▲▲ 이 한 줄만 바꾸면 돼요 ▲▲ */
var S = { tok: null, me: null, pid: null, today: null, queue: [], practice: null, iv: null, tts: true, weakFilter: '전체' };

/* ---------------- 공통 도구 ---------------- */
function esc(s){return String(s==null?'':s).replace(/[&<>"']/g,function(c){return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c];});}
function $(id){return document.getElementById(id);}
function store(k,v){try{if(v===undefined)return localStorage.getItem(k);if(v===null)localStorage.removeItem(k);else localStorage.setItem(k,v);}catch(e){return null;}}
function onApiError(m,rej){
  if(m.indexOf('SESSION_EXPIRED')>=0){store('mj_tok',null);S.tok=null;hideLoading();toast('다시 로그인해 주세요.');showLogin();return;}
  rej(new Error(m.replace(/^Exception:\s*/,'')));
}
function api(fn){
  var args=Array.prototype.slice.call(arguments,1);
  return new Promise(function(res,rej){
    if(window.google&&google.script&&google.script.run){
      var r=google.script.run.withSuccessHandler(res).withFailureHandler(function(err){onApiError((err&&err.message)||String(err),rej);});
      r[fn].apply(r,args);return;
    }
    // 구글 바깥(학생용 페이지)에서 열렸을 때: 웹 앱 주소로 직접 요청
    fetch(APP_URL,{method:'POST',headers:{'Content-Type':'text/plain;charset=utf-8'},body:JSON.stringify({fn:fn,args:args}),redirect:'follow'})
      .then(function(x){return x.json();})
      .then(function(r){if(r&&r.err)onApiError(r.err,rej);else res(r?r.ok:null);},
            function(){rej(new Error('서버에 연결하지 못했어요. 인터넷 연결을 확인해 주세요.'));});
  });
}
function loading(msg,sub){$('overlay').innerHTML='<div class="loading"><div class="spin"></div><div style="font-weight:600">'+esc(msg||'잠시만요')+'</div>'+(sub?'<div class="small muted">'+esc(sub)+'</div>':'')+'</div>';}
function hideLoading(){$('overlay').innerHTML='';}
var toastTimer;
function toast(m){clearTimeout(toastTimer);var d=document.createElement('div');d.className='toast';d.textContent=m;document.body.appendChild(d);toastTimer=setTimeout(function(){d.remove();},3200);}
function fail(e){hideLoading();toast(e.message||String(e));}
function render(html){$('app').innerHTML=html;window.scrollTo(0,0);}
function ddayText(d){if(d===null||d===undefined)return '';return d>0?'D-'+d:(d===0?'D-DAY':'D+'+(-d));}

var IC={
 mic:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><rect x="9" y="3" width="6" height="11" rx="3"/><path d="M5 11a7 7 0 0 0 14 0"/><path d="M12 18v3"/></svg>',
 home:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M4 11l8-7 8 7v9a1 1 0 0 1-1 1h-5v-6h-4v6H5a1 1 0 0 1-1-1z"/></svg>',
 note:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M5 4h11a3 3 0 0 1 3 3v13H8a3 3 0 0 1-3-3z"/><path d="M9 9h6M9 13h4"/></svg>',
 doc:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M14 3H7a2 2 0 0 0-2 2v14a2 2 0 0 0 2 2h10a2 2 0 0 0 2-2V8z"/><path d="M14 3v5h5"/></svg>',
 docplus:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M14 3H7a2 2 0 0 0-2 2v14a2 2 0 0 0 2 2h10a2 2 0 0 0 2-2V8z"/><path d="M14 3v5h5"/><path d="M12 11v6M9 14h6"/></svg>',
 redo:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M4 12a8 8 0 0 1 14-5.3L20 9"/><path d="M20 4v5h-5"/><path d="M20 12a8 8 0 0 1-14 5.3L4 15"/><path d="M4 20v-5h5"/></svg>',
 link:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M10 14a4 4 0 0 0 5.66 0l3-3a4 4 0 0 0-5.66-5.66l-1 1"/><path d="M14 10a4 4 0 0 0-5.66 0l-3 3a4 4 0 0 0 5.66 5.66l1-1"/></svg>',
 shield:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M12 3l8 3v6c0 5-3.5 8-8 9-4.5-1-8-4-8-9V6z"/><path d="M9 12l2 2 4-4"/></svg>',
 speaker:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M11 5L6 9H3v6h3l5 4z"/><path d="M16 9a4 4 0 0 1 0 6"/><path d="M19 6a8 8 0 0 1 0 12"/></svg>',
 back:'<svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M15 5l-7 7 7 7"/></svg>',
 stop:'<svg viewBox="0 0 24 24" fill="currentColor"><rect x="7" y="7" width="10" height="10" rx="2"/></svg>'
};

function nav(on){
  var t=[['home','오늘',IC.home],['interview','모의면접',IC.mic],['weak','취약노트',IC.note],['record','내 생기부',IC.doc]];
  return '<nav class="nav" aria-label="메뉴">'+t.map(function(x){return '<button type="button" class="'+(x[0]===on?'on':'')+'" onclick="go(\''+x[0]+'\')">'+x[2]+x[1]+'</button>';}).join('')+'</nav>';
}
function go(v){stopSpeak();stopRec();if(v==='home')showHome();else if(v==='interview')showInterviewSetup();else if(v==='weak')showWeak();else if(v==='record')showRecord();else if(v==='me')showMe();}
function topbar(){return '<div class="top"><span class="serif" style="font-size:18px;font-weight:700;color:var(--navy)">면접연습실</span><button class="avatar" type="button" aria-label="내 정보" onclick="go(\'me\')">'+esc((S.me&&S.me.name||'나').charAt(0))+'</button></div>';}
function backbar(title,fn){return '<div class="row"><button type="button" aria-label="뒤로" onclick="'+fn+'" style="width:40px;height:40px;border-radius:50%;border:1px solid var(--line);background:#fff;display:flex;align-items:center;justify-content:center">'+IC.back+'</button><h1 style="font-size:21px">'+esc(title)+'</h1></div>';}
function curProfile(){if(!S.me)return null;var p=S.me.profiles.filter(function(x){return x.id===S.pid;})[0];return p||S.me.profiles[0]||null;}

/* ---------------- 음성: 읽어주기(TTS) · 말로 답하기(STT) ---------------- */
function speak(text){
  if(!S.tts||!('speechSynthesis' in window))return;
  try{speechSynthesis.cancel();var u=new SpeechSynthesisUtterance(text);u.lang='ko-KR';u.rate=1.0;
    var v=speechSynthesis.getVoices().filter(function(x){return /ko/i.test(x.lang);})[0];if(v)u.voice=v;speechSynthesis.speak(u);}catch(e){}
}
function stopSpeak(){try{speechSynthesis.cancel();}catch(e){}}
var REC=null, recBase='', recOn=false, recBroken=false;
function recSupported(){return !recBroken&&!!(window.SpeechRecognition||window.webkitSpeechRecognition);}
function toggleRec(boxId,btnId){
  if(recOn){stopRec();return;}
  var SR=window.SpeechRecognition||window.webkitSpeechRecognition;
  if(!SR||recBroken){showKeyboardHint();return;}
  var box=$(boxId);recBase=box.value?box.value.replace(/\s*$/,' '):'';
  REC=new SR();REC.lang='ko-KR';REC.continuous=true;REC.interimResults=true;
  REC.onresult=function(e){var fin='',tmp='';for(var i=0;i<e.results.length;i++){if(e.results[i].isFinal)fin+=e.results[i][0].transcript;else tmp+=e.results[i][0].transcript;}box.value=recBase+fin+tmp;};
  REC.onerror=function(e){if(e.error==='not-allowed'||e.error==='service-not-allowed'||e.error==='audio-capture'){recBroken=true;showKeyboardHint();}stopRec();};
  REC.onend=function(){if(recOn){try{REC.start();}catch(err){stopRec();}}};
  try{REC.start();recOn=true;setMicBtn(btnId,true);}catch(err){recBroken=true;showKeyboardHint();}
}
function stopRec(){recOn=false;if(REC){try{REC.onend=null;REC.stop();}catch(e){}}REC=null;document.querySelectorAll('.mic').forEach(function(b){b.classList.add('idle');b.innerHTML=IC.mic;});var st=$('recState');if(st)st.textContent='';}
function setMicBtn(id,on){var b=$(id);if(!b)return;b.classList.toggle('idle',!on);b.innerHTML=on?IC.stop:IC.mic;var st=$('recState');if(st)st.textContent=on?'듣는 중… 말을 마치면 네모 버튼을 누르세요':'';}
function showKeyboardHint(){toast('이 화면에서는 마이크를 바로 쓸 수 없어요. 키보드의 마이크 버튼을 눌러 말하면 글자로 입력돼요.');var h=$('kbHint');if(h)h.classList.remove('hidden');}
function answerBox(id,dark){
  return '<div class="col"><div class="row" style="align-items:flex-end">'+
    '<textarea class="text grow" id="'+id+'" placeholder="말하거나 입력해서 답하세요" aria-label="내 답변"></textarea>'+
    '<button type="button" class="mic idle" id="'+id+'Mic" aria-label="말로 답하기" onclick="toggleRec(\''+id+'\',\''+id+'Mic\')">'+IC.mic+'</button></div>'+
    '<div class="xs" id="recState" style="color:'+(dark?'#F2C979':'var(--navy)')+'"></div>'+
    '<div class="xs '+(recSupported()?'hidden':'')+'" id="kbHint" style="color:'+(dark?'var(--darkMuted)':'var(--muted)')+'">키보드의 마이크 버튼을 눌러 말하면 글자로 바뀌어요.</div></div>';
}

/* ---------------- 로그인 ---------------- */
function showLogin(){
  render('<div class="page" style="padding-top:64px;gap:32px">'+
   '<div class="col" style="gap:14px"><div style="width:52px;height:52px;border-radius:14px;background:var(--navy);color:#fff;display:flex;align-items:center;justify-content:center">'+IC.mic.replace('<svg','<svg width="26" height="26"')+'</div>'+
   '<h1 style="font-size:32px">면접연습실</h1><p class="muted" style="font-size:15px;line-height:1.6">생활기록부에서 시작해서, 하루 12분씩<br>내 면접 답변을 단단하게 만드는 곳</p></div>'+
   '<form class="col" style="gap:10px" onsubmit="doLogin(event)"><label class="inp" for="code">로그인 코드</label>'+
   '<input class="text code" id="code" autocomplete="off" autocapitalize="characters" placeholder="예: 7K2M-9Q4X" maxlength="12">'+
   '<p class="small muted">담임선생님께 받은 8자리 코드를 입력하세요. 코드는 다른 친구에게 알려주지 마세요.</p>'+
   '<button class="btn" type="submit" style="margin-top:6px">입장하기</button></form>'+
   '<p class="small muted" style="margin-top:auto;text-align:center">선생님이신가요? <a href="'+esc(APP_URL)+'?page=teacher" target="_top">교사용 화면</a></p></div>');
}
function doLogin(e){
  e.preventDefault();var code=$('code').value;loading('확인하는 중');
  api('studentLogin',code).then(function(r){S.tok=r.token;store('mj_tok',r.token);loadMe();}).catch(fail);
}
function loadMe(){
  loading('불러오는 중');
  api('getStudentState',S.tok).then(function(me){
    hideLoading();S.me=me;var saved=store('mj_pid');
    S.pid=me.profiles.some(function(p){return p.id===saved;})?saved:(me.profiles.filter(function(p){return p.dday===null||p.dday>=0;})[0]||me.profiles[0]||{}).id;
    if(!me.consent)showConsent(true);else showHome();

function startQueue(kind){
  var items=(S.today&&S.today.items)||[];
  var pick=items.filter(function(i){return (!kind||i.kind===kind)&&!i.done;});
  if(kind&&!pick.length)pick=items.filter(function(i){return i.kind===kind;});
  if(!pick.length){showInterviewSetup();return;}
  S.queue=pick.map(function(i){return i;});
  S.queueGoLive=!kind;
  nextInQueue();
}
function nextInQueue(){
  var it=S.queue.shift();
  if(!it){if(S.queueGoLive&&!(S.today&&S.today.live.done)){toast('문항 훈련 끝! 이제 실전 면접으로 마무리해요.');showInterviewSetup();}else{toast('훈련을 마쳤어요.');showHome();}return;}
  showPractice({id:it.id,text:it.text,type:it.type,level:it.level,kind:it.kind,required:it.required});
}

/* PDF에서 글자만 뽑기 (pdf.js). 원본 파일은 서버로 보내지 않아요. */
var PDFJS_VER='3.11.174';
function loadScript(src){return new Promise(function(res,rej){var s=document.createElement('script');s.src=src;s.onload=res;s.onerror=function(){rej(new Error('도구를 불러오지 못했어요. 인터넷 연결을 확인해 주세요.'));};document.head.appendChild(s);});}
function ensurePdfJs(){
  if(window.pdfjsLib)return Promise.resolve();
  var base='https://cdnjs.cloudflare.com/ajax/libs/pdf.js/'+PDFJS_VER+'/';
  return loadScript(base+'pdf.min.js').then(function(){
    return fetch(base+'pdf.worker.min.js').then(function(r){return r.text();}).then(function(code){
      pdfjsLib.GlobalWorkerOptions.workerSrc=URL.createObjectURL(new Blob([code],{type:'text/javascript'}));
    }).catch(function(){pdfjsLib.GlobalWorkerOptions.workerSrc=base+'pdf.worker.min.js';});
  });
}
function extractPdfText(buf){
  return pdfjsLib.getDocument({data:buf}).promise.then(function(pdf){
    var pages=[];for(var i=1;i<=pdf.numPages;i++)pages.push(i);
    return pages.reduce(function(chain,n){return chain.then(function(acc){return pdf.getPage(n).then(function(pg){return pg.getTextContent();}).then(function(tc){
      var out='',lastY=null;tc.items.forEach(function(it){var y=it.transform?Math.round(it.transform[5]):null;if(lastY!==null&&y!==null&&Math.abs(y-lastY)>2)out+='\n';out+=it.str;if(it.hasEOL)out+='\n';lastY=y;});
      return acc+out+'\n';});});},Promise.resolve(''));
  });
}
function redact(t){
  return t.replace(/\d{6}\s*-\s*[1-4][\d*●○xX]{6}/g,'[주민번호 삭제]')
    .replace(/01[016789]\s*-?\s*\d{3,4}\s*-?\s*\d{4}/g,'[전화번호 삭제]')
    .replace(/0\d{1,2}\s*-\s*\d{3,4}\s*-\s*\d{4}/g,'[전화번호 삭제]')
    .split('\n').map(function(line){return /(주\s*소|주민\s*등록|보호자\s*연락처|가족\s*상황)/.test(line)?'[개인정보 줄 삭제]':line;}).join('\n');
}
function uploadRecord(input){
  var f=input.files&&input.files[0];input.value='';if(!f)return;
  if(!/\.pdf$/i.test(f.name)&&f.type!=='application/pdf'){toast('PDF 파일만 올릴 수 있어요.');return;}
  if(f.size>15*1024*1024){toast('파일이 너무 커요(15MB 이하).');return;}
  loading('생기부에서 글자를 읽는 중','휴대폰 안에서만 읽어요');
  var bufP=f.arrayBuffer();
  ensurePdfJs().then(function(){return bufP;}).then(function(buf){return extractPdfText(buf.slice(0)).then(function(text){return {text:text,buf:buf};});})
  .then(function(x){
    var text=redact(x.text||'').replace(/[ \t]+/g,' ').replace(/\n{3,}/g,'\n\n').trim();
    var payload={text:text};
    if(text.length<300){
      if(f.size>7*1024*1024)throw new Error('글자를 읽을 수 없는 스캔 파일이에요. 나이스에서 PDF로 다시 저장해 주세요.');
      payload.pdfBase64=b64(x.buf);
    }
    loading('생기부 지뢰찾기 중','면접관이 물을 만한 문장을 찾고 있어요 (1~2분)');
    return api('analyzeRecord',S.tok,payload);
  }).then(function(r){
    hideLoading();S.me.analysis='완료';
    toast('면접 포인트 '+r.points+'개, 질문 '+r.questions+'개를 만들었어요.'+(r.dropped?' (원문과 맞지 않는 '+r.dropped+'개는 뺐어요)':''));
    showRecord();
  }).catch(fail);
}
function b64(buf){var bytes=new Uint8Array(buf),bin='',chunk=0x8000;for(var i=0;i<bytes.length;i+=chunk)bin+=String.fromCharCode.apply(null,bytes.subarray(i,i+chunk));return btoa(bin);}

/* ---------------- 내 정보 ---------------- */
function showMe(){
  var me=S.me;
  var html='<div class="page">'+backbar('내 정보','go(\'home\')')+
   '<div class="card pad col"><b style="font-size:17px">'+esc(me.name)+'</b><span class="small muted">'+esc(me.hakbun)+' · '+esc(me.year)+'학년도'+(me.school?' · '+esc(me.school):'')+'</span></div>'+
   '<div class="card pad col" style="gap:10px"><h2>개인정보 동의</h2><span class="small">상태: <b>'+esc(me.consent||'동의 전')+'</b>'+(me.consentAt?' <span class="muted">('+esc(me.consentAt)+')</span>':'')+'</span>'+
   '<span class="xs muted">질문·훈련기록은 '+esc(me.expireDate)+'까지 보관 후 자동 삭제돼요.</span>'+
   (me.consent==='동의'?'<button class="btn-sm" type="button" style="align-self:flex-start;color:var(--red)" onclick="withdraw()">필수 동의 철회 (분석 결과·훈련기록 삭제)</button>':'<button class="btn-sm" type="button" style="align-self:flex-start" onclick="showConsent(false)">동의하기</button>')+
   '<label class="check small" style="margin-top:6px"><input type="checkbox" '+(me.reviewConsent?'checked':'')+' onchange="toggleReview(this.checked)"><span>[선택] 실제 면접 후기 익명 활용에 동의</span></label></div>'+
   '<div class="card pad col" style="gap:10px"><h2>실제 면접 후기 남기기</h2><p class="small muted" style="line-height:1.55">면접을 보고 왔다면 실제로 받은 질문을 적어 주세요. 이름·학번 없이 저장돼서 내년 후배들의 질문은행이 돼요.</p>'+
   '<button class="btn2" type="button" onclick="showReview()">후기 쓰기</button></div>'+
   '<div class="card pad col" style="gap:10px"><h2>최근 답변 기록</h2><div id="hist" class="small muted">불러오는 중…</div></div>'+
   '<button class="btn2" type="button" onclick="logoutNow()">로그아웃</button></div>';
  render(html);
  api('getMyHistory',S.tok).then(function(list){
    $('hist').innerHTML=list.length?list.slice(0,15).map(function(a){return '<div class="col" style="gap:3px;padding:8px 0;border-bottom:1px solid var(--line2);color:var(--ink)"><div class="row" style="gap:6px"><span class="tag '+(a.result==='통과'?'t-준비완료':'t-고위험')+'">'+esc(a.result)+'</span><span class="xs muted">'+esc(a.at.slice(5,16))+' · '+esc(a.mode)+(a.teacherResult?' · 선생님 확인':'')+'</span></div><span>'+esc(a.question)+'</span>'+(a.teacherMemo&&a.teacherMemo!=='확인함'?'<span class="xs" style="color:var(--gold)">선생님: '+esc(a.teacherMemo)+'</span>':'')+'</div>';}).join(''):'아직 기록이 없어요.';
  }).catch(function(){});
}
function toggleReview(v){api('setReviewConsent',S.tok,v).then(function(){S.me.reviewConsent=v;toast(v?'후기 활용에 동의했어요.':'후기 활용 동의를 철회했어요.');}).catch(fail);}
function withdraw(){
  if(!confirm('필수 동의를 철회하면 생기부 분석 결과와 모든 훈련 기록이 바로 삭제돼요. 계속할까요?'))return;
  loading('삭제하는 중');
  api('withdrawConsent',S.tok).then(function(){hideLoading();S.me.consent='철회';S.me.analysis='';S.me.reviewConsent=false;toast('철회하고 기록을 삭제했어요.');showMe();}).catch(fail);
}
function logoutNow(){api('logout',S.tok).catch(function(){});store('mj_tok',null);S={tok:null,me:null,pid:null,today:null,queue:[],practice:null,iv:null,tts:true,weakFilter:'전체'};showLogin();}
var REVIEW_TYPES=['사실확인','개념설명','탐구과정','결과해석','한계·오차','전공연결','지원동기','가치판단','반론·압박'];
function showReview(){
  if(!S.me.reviewConsent){toast('먼저 [선택] 후기 활용에 동의해 주세요.');return;}
  var opts=S.me.profiles.map(function(p){return '<option value="'+esc(p.id)+'">'+esc(p.uni+' '+p.major)+'</option>';}).join('');
  var rowsH='';for(var i=0;i<4;i++)rowsH+=reviewRow(i);
  render('<div class="page" style="padding-bottom:40px">'+backbar('면접 후기','showMe()')+
   '<label class="inp" for="rvP">면접 본 대학</label><select class="text" id="rvP">'+opts+'</select>'+
   '<div class="col" id="rvRows" style="gap:12px">'+rowsH+'</div>'+
   '<button class="btn2" type="button" onclick="addReviewRow()">질문 칸 추가</button>'+
   '<label class="inp" for="rvM">면접 분위기·방식 메모 (선택)</label><textarea class="text" id="rvM" style="min-height:90px" placeholder="예: 면접관 2명, 10분, 제시문 없음"></textarea>'+
   '<button class="btn" type="button" onclick="sendReview()">후기 저장</button></div>');
}
function reviewRow(i){return '<div class="card pad col" style="gap:8px"><label class="xs muted" for="rvQ'+i+'">받은 질문 '+(i+1)+'</label><textarea class="text rvq" id="rvQ'+i+'" style="min-height:70px"></textarea><select class="text rvt" aria-label="질문 유형">'+REVIEW_TYPES.map(function(t){return '<option>'+t+'</option>';}).join('')+'</select></div>';}
function addReviewRow(){var box=$('rvRows');var n=box.children.length;box.insertAdjacentHTML('beforeend',reviewRow(n));}
function sendReview(){
  var qs=[].slice.call(document.querySelectorAll('.rvq')),ts=[].slice.call(document.querySelectorAll('.rvt'));
  var items=qs.map(function(q,i){return {question:q.value,type:ts[i].value};}).filter(function(x){return x.question.trim();});
  if(!items.length){toast('받은 질문을 한 개 이상 적어 주세요.');return;}
  loading('저장하는 중');
  api('submitReview',S.tok,$('rvP').value,items,$('rvM').value).then(function(n){hideLoading();toast('후기 '+n+'개를 저장했어요. 고마워요!');showMe();}).catch(fail);
}

/* ---------------- 시작 ---------------- */
(function boot(){
  try{speechSynthesis.getVoices();}catch(e){}
  if(!/^https:\/\//.test(APP_URL)){render('<div class="page" style="padding-top:80px"><h1>설정이 필요해요</h1><p class="muted" style="line-height:1.6">이 파일의 <b>APP_URL</b> 줄에 구글 웹 앱 주소를 붙여넣어 주세요.</p></div>');return;}
  S.tok=store('mj_tok');
  if(S.tok)loadMe();else showLogin();
})();
</script>
